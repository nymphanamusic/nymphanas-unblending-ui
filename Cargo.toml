[package]
name = "nymphanas-unblending-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
autocxx = "0.30.0"
cc = "1.2.52"
cmake = "0.1.57"
cxx = "1.0.192"
eframe = { version = "0.33.3", features = ["wgpu"] }
egui = "0.33.3"
egui_extras = { version = "0.33.3", features = ["image"] }
env_logger = "0.11.8"
image = { version = "0.25.9", features = ["jpeg", "png"] }
rfd = "0.17.2"

[build-dependencies]
cxx-build = "1.0.192"
cmake = "0.1.57"
cc = "1.2.52"
autocxx-build = "0.30.0"
miette = { version = "7.6.0", features = ["fancy"] }
